<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falah OS — Site Classifications</title>
  <style>
    :root {
      --bg: #0e0e11; --surface: #141418; --surface2: #1a1a1f;
      --gold: #c9983c; --gold-dim: rgba(201,152,60,0.12);
      --jade: #10b981; --ruby: #ef4444; --amber: #f59e0b;
      --text: rgba(255,255,255,0.88); --text-dim: rgba(255,255,255,0.5);
      --text-faint: rgba(255,255,255,0.28); --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); padding: 32px;
      max-width: 760px; margin: 0 auto; font-size: 13px;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
    .header-icon { font-size: 28px; }
    h1 { font-size: 20px; font-weight: 600; color: var(--gold); }
    .header-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; letter-spacing: 0.04em; }
    table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    th { padding: 9px 12px; text-align: left; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }
    tr:hover td { background: var(--surface); }
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; display: inline-block; }
    .badge.halal  { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.25); }
    .badge.makruh { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
    .badge.haram  { background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
    button {
      padding: 5px 12px; border: 1px solid var(--border);
      background: var(--surface2); border-radius: 5px; color: var(--text-dim);
      cursor: pointer; font: 12px 'DM Sans',system-ui,sans-serif;
      transition: all 0.15s;
    }
    button:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .actions { margin-top: 20px; display: flex; gap: 8px; }
    .btn-export { background: var(--gold-dim); border-color: rgba(201,152,60,0.3); color: var(--gold); }
    .btn-export:hover { background: rgba(201,152,60,0.2); }
    .btn-clear { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); color: #ef4444; }
    .btn-clear:hover { background: rgba(239,68,68,0.15); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">☽</div>
    <div>
      <h1>Site Classifications</h1>
      <div class="header-sub">Falah OS v2.1 — Institutional Noir · Your personal halal/makruh/haram overrides</div>
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Status</th>
        <th>Date Set</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="actions">
    <button class="btn-export" id="export">Export JSON</button>
    <button class="btn-clear" id="clearAll">Clear All</button>
  </div>
  <script src="options.js"></script>
</body>
</html>
